# identity on top of the local infrastructure stack.
#
# Always used together with back/deploy/docker-compose.yml, which defines
# postgres, kafka, kafka-init and the `agrogram` network (identity uses no
# Redis). From the
# directory that contains back/:
#
#   docker compose -f back/deploy/docker-compose.yml -f back/services/identity/compose.yaml \
#     up -d --build --wait identity
#
# (or `make compose-up` in back/services/identity). With several -f files,
# Compose resolves relative paths against the FIRST file's directory
# (back/deploy/) and reads back/deploy/.env for interpolation; hence the build
# context `..` (= back/) and the password from IDENTITY_DB_PASSWORD, which
# that .env already defines.
#
# Needs `make gen` in back/services/identity beforehand (the image compiles
# against back/gen/go).

x-identity-image: &identity-image
  image: agrogram/identity:dev
  build:
    context: ..
    dockerfile: services/identity/Dockerfile

x-identity-env: &identity-env
  # In-network addresses; passwords come from back/deploy/.env.
  IDENTITY_DATABASE_URL: postgres://identity:${IDENTITY_DB_PASSWORD:?copy deploy/.env.example to deploy/.env and set it}@postgres:5432/identity?sslmode=disable
  IDENTITY_KAFKA_BROKERS: kafka:9092
  IDENTITY_GRPC_ADDR: ":50051"
  IDENTITY_HTTP_ADDR: ":8081"
  IDENTITY_LOG_FORMAT: json
  IDENTITY_LOG_LEVEL: ${IDENTITY_LOG_LEVEL:-info}
  # Local stack only: lets grpcurl discover the API. Keep it off elsewhere.
  IDENTITY_GRPC_REFLECTION: ${IDENTITY_GRPC_REFLECTION:-true}

services:
  # One-shot: applies the migrations, then exits 0; identity waits for it.
  identity-migrate:
    <<: *identity-image
    command: ["migrate", "up"]
    restart: "no"
    environment: *identity-env
    networks: [agrogram]
    depends_on:
      postgres:
        condition: service_healthy
    # The image HEALTHCHECK probes the HTTP server, which `migrate` never starts.
    healthcheck:
      disable: true

  identity:
    <<: *identity-image
    restart: unless-stopped
    environment: *identity-env
    networks: [agrogram]
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      # gRPC and health on the host, loopback only.
      - "127.0.0.1:${IDENTITY_GRPC_PORT:-15051}:50051"
      - "127.0.0.1:${IDENTITY_HTTP_PORT:-18051}:8081"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/identity", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
