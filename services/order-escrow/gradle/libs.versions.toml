# order-escrow dependency versions (Gradle version catalog).
#
# The protobuf and gRPC runtimes MUST match the code generators pinned in
# back/buf.gen.yaml: protocolbuffers/java v36.2 -> protobuf-java 4.36.2 (the
# generated code refuses an older runtime) and grpc/java v1.84.0 -> grpc-java
# 1.84.0. Spring Boot's BOM manages older ones (protobuf 4.35.1, grpc 1.83.1);
# the two BOMs below are imported as platforms too, and Gradle resolves every
# module to the highest version any platform asks for, so these pins win.
# Change them only together with back/buf.gen.yaml.
#
# Everything else (Kafka clients, Flyway, the PostgreSQL driver, HikariCP,
# JUnit, AssertJ, Mockito) comes from the Spring Boot BOM.

[versions]
spring-boot = "4.1.1"
protobuf = "4.36.2"
grpc = "1.84.0"
# build.buf:protovalidate provides the buf.validate.* classes the generated
# code imports (they are not in back/gen/java) and the CEL-based validator.
protovalidate = "1.3.0"

[libraries]
protobuf-bom = { module = "com.google.protobuf:protobuf-bom", version.ref = "protobuf" }
grpc-bom = { module = "io.grpc:grpc-bom", version.ref = "grpc" }
protovalidate = { module = "build.buf:protovalidate", version.ref = "protovalidate" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
