syntax = "proto3";

package agrogram.identity.v1;

import "buf/validate/validate.proto";
import "common/v1/auth.proto";
import "google/protobuf/timestamp.proto";

// IdentityService owns accounts and their role set.
//
// AGROGRAM is listings-only with one flat tier: there is no plan, no Premium
// and no e-ijara farmer verification, and posting needs no role (any
// signed-in user may post on either board). ADMIN (staff) is the only role.
// Other services see roles as a token-time snapshot in the `x-agrogram-*`
// metadata and call GetAccount when they need live values.
//
// Removed with the listings-only pivot (RPCs cannot be reserved; the names
// must not be reused): SubmitFarmerVerification, GetFarmerVerification,
// SetAccountPremium, with their request / response messages, Plan,
// FarmerVerificationStatus, LandLease and FarmerVerification.
service IdentityService {
  // Internal (auth-gateway). Creates an account on a first sign-in, with no
  // roles. A retry with the same `request_id` returns the same account.
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);

  // Returns an account's status and roles. Users read their own account;
  // staff and internal callers may read any.
  rpc GetAccount(GetAccountRequest) returns (GetAccountResponse);
}

// AccountStatus is whether an account may be used.
enum AccountStatus {
  ACCOUNT_STATUS_UNSPECIFIED = 0;
  // Normal.
  ACCOUNT_STATUS_ACTIVE = 1;
  // Blocked by staff; sign-in fails with ACCOUNT_DISABLED.
  ACCOUNT_STATUS_BLOCKED = 2;
  // Deleted at the user's request (soft delete; history is kept).
  ACCOUNT_STATUS_DELETED = 3;
}

// Account is a user account as identity sees it. Names, avatars and other
// public details are in profile-social; credentials are in auth-gateway.
message Account {
  // Plan, Premium and farmer verification fields: one flat tier, no
  // verification.
  reserved 4 to 8;
  reserved "plan", "is_premium", "premium_until", "is_verified_farmer", "farmer_verification_status";

  // User id (UUID), shared by every service.
  string id = 1;

  // Roles held now (ADMIN or none).
  repeated common.v1.Role roles = 2;

  // Whether the account may be used.
  AccountStatus status = 3;

  // Optimistic-concurrency version.
  int64 version = 9;

  // When the account was created.
  google.protobuf.Timestamp created_at = 10;

  // When the account last changed.
  google.protobuf.Timestamp updated_at = 11;
}

// CreateAccountRequest is the input of CreateAccount.
message CreateAccountRequest {
  // Idempotency key (UUID). auth-gateway derives it from the sign-in identity,
  // so a retried first sign-in never creates two accounts.
  string request_id = 1 [(buf.validate.field).string.uuid = true];
}

// CreateAccountResponse is the output of CreateAccount.
message CreateAccountResponse {
  // The new account.
  Account account = 1;
}

// GetAccountRequest is the input of GetAccount.
message GetAccountRequest {
  // Account to read. Empty = the caller.
  string user_id = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];
}

// GetAccountResponse is the output of GetAccount.
message GetAccountResponse {
  // The account.
  Account account = 1;
}
