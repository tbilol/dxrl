syntax = "proto3";

package agrogram.events.v1;

import "buf/validate/validate.proto";
import "common/v1/address.proto";
import "common/v1/market.proto";
import "common/v1/money.proto";
import "common/v1/product.proto";
import "common/v1/quantity.proto";
import "events/v1/metadata.proto";
import "google/protobuf/timestamp.proto";

// Transaction stream
// ==================
//
//   Topic      agrogram.orderescrow.transaction.v1
//   Key        transaction_id
//   Producer   order-escrow
//   Consumers  catalog (remaining and sold quantity), profile-social (deal
//              counts; completion unlocks ratings), analytics (completed
//              deals), notification (step updates to both parties)
//
// An escrow transaction (tranzaksiya) emits its events in this order:
//
//   Event               State after         Triggered by
//   TransactionCreated  AWAITING_PAYMENT    CreateTransaction (counterparty of the listing owner)
//   PaymentHeld         PAYMENT_HELD        PayIn (reseller), once the funds are held
//   ReceiptSubmitted    RECEIPT_SUBMITTED   SubmitWeighbridgeReceipt (reseller)
//   ProductHandover     HANDED_OVER         ConfirmHandover (farmer)
//   ReceiptConfirmed    RECEIVED            ConfirmReceipt (reseller)
//   PayoutReleased      COMPLETED           order-escrow, right after ReceiptConfirmed
//   BonusAwarded        COMPLETED           order-escrow, after PayoutReleased
//
// Tax, payment-provider, weighbridge and bonus details are stubs, marked
// TODO(tax), TODO(payments), TODO(weighbridge) and TODO(bonus).

// TransactionState is the step an escrow transaction is at.
//
// The app shows seven steps (front-end STEP_KEYS). `escrow` and `payout` are
// system steps. `collect` (the reseller picks up and weighs the goods) has no
// command of its own: submitting the weighbridge receipt completes it.
//
//   State               App steps done       Waiting for
//   AWAITING_PAYMENT    none                 pay: PayIn (reseller)
//   PAYMENT_HELD        pay, escrow          collect + receipt: SubmitWeighbridgeReceipt (reseller)
//   RECEIPT_SUBMITTED   + collect, receipt   handover: ConfirmHandover (farmer)
//   HANDED_OVER         + handover           received: ConfirmReceipt (reseller)
//   RECEIVED            + received           payout (order-escrow)
//   COMPLETED           all seven            nothing; ratings are unlocked
enum TransactionState {
  TRANSACTION_STATE_UNSPECIFIED = 0;
  // Created; waiting for the reseller to pay the total into escrow.
  TRANSACTION_STATE_AWAITING_PAYMENT = 1;
  // Funds are held in escrow; the reseller collects and weighs the goods.
  TRANSACTION_STATE_PAYMENT_HELD = 2;
  // Weighbridge receipt submitted; waiting for the farmer to confirm handover.
  TRANSACTION_STATE_RECEIPT_SUBMITTED = 3;
  // Farmer confirmed the handover; waiting for the reseller to confirm receipt.
  TRANSACTION_STATE_HANDED_OVER = 4;
  // Reseller confirmed receiving the goods; the payout is being released.
  TRANSACTION_STATE_RECEIVED = 5;
  // Payout released to the farmer. Final.
  TRANSACTION_STATE_COMPLETED = 6;
}

// ReceiptVerificationStatus is the outcome of checking a weighbridge receipt.
//
// TODO(weighbridge): there is no weighbridge integration or OCR comparison
// yet, so every receipt is VERIFIED as soon as it is submitted.
enum ReceiptVerificationStatus {
  RECEIPT_VERIFICATION_STATUS_UNSPECIFIED = 0;
  // Submitted; the check has not finished.
  RECEIPT_VERIFICATION_STATUS_PENDING = 1;
  // Accepted.
  RECEIPT_VERIFICATION_STATUS_VERIFIED = 2;
  // Did not pass the check (ERROR_REASON_RECEIPT_REJECTED).
  RECEIPT_VERIFICATION_STATUS_REJECTED = 3;
}

// TransactionAmounts is the money side of a transaction, fixed when it is
// created. Every amount is in UZS.
//
//   total         = subtotal + tax + platform_fee   (what the reseller pays in)
//   payout_amount = subtotal                        (what the farmer receives)
message TransactionAmounts {
  // unit_price x quantity, rounded half-up to whole tiyin.
  common.v1.Money subtotal = 1 [(buf.validate.field).required = true];

  // TODO(tax): the tax regime is not designed. Always zero until then; once
  // designed it may also be withheld from payout_amount.
  common.v1.Money tax = 2 [(buf.validate.field).required = true];

  // TODO(payments): always zero; payments are commission-free today.
  common.v1.Money platform_fee = 3 [(buf.validate.field).required = true];

  // What the reseller pays into escrow.
  common.v1.Money total = 4 [(buf.validate.field).required = true];

  // What the farmer receives when the payout is released.
  common.v1.Money payout_amount = 5 [(buf.validate.field).required = true];
}

// WeighbridgeReceipt is the weighbridge ticket (tarozi cheki) the reseller
// submits after weighing the goods: a ticket number, a photo, or both.
message WeighbridgeReceipt {
  // Ticket number as printed on the receipt.
  string ticket_number = 1 [(buf.validate.field).string.max_len = 64];

  // Photo of the ticket: a media-pipeline upload with purpose
  // MEDIA_PURPOSE_WEIGHBRIDGE_RECEIPT, private to the parties and staff.
  string photo_media_id = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string.uuid = true
  ];

  // Net weight on the ticket, when typed in or read by OCR.
  common.v1.Mass net_mass = 3;

  // Outcome of the check. TODO(weighbridge): always VERIFIED for now.
  ReceiptVerificationStatus verification_status = 4 [(buf.validate.field).enum.defined_only = true];

  // When the receipt was submitted.
  google.protobuf.Timestamp submitted_at = 5;

  // When the check finished (VERIFIED or REJECTED).
  google.protobuf.Timestamp verified_at = 6;
}

// TransactionEvent is the envelope of the transaction stream, one per Kafka
// record.
message TransactionEvent {
  // Event header.
  EventMetadata metadata = 1 [(buf.validate.field).required = true];

  // The transaction after the event.
  TransactionSnapshot transaction = 2 [(buf.validate.field).required = true];

  // The concrete event. Producers set exactly one case. The oneof is not
  // `required` on purpose: a consumer on an older schema sees a newer case as
  // unset and must still accept the record (see metadata.proto).
  oneof event {
    // A transaction was started on a listing.
    TransactionCreated transaction_created = 10;
    // The reseller's pay-in is held in escrow.
    PaymentHeld payment_held = 11;
    // The reseller submitted the weighbridge receipt.
    ReceiptSubmitted receipt_submitted = 12;
    // The farmer confirmed handing the goods over.
    ProductHandover product_handover = 13;
    // The reseller confirmed receiving the goods.
    ReceiptConfirmed receipt_confirmed = 14;
    // Escrow paid the farmer; the transaction is complete.
    PayoutReleased payout_released = 15;
    // Bonus points were credited after completion.
    BonusAwarded bonus_awarded = 16;
  }
}

// TransactionSnapshot is the state of a transaction. It carries no contact
// details and no payment-provider references.
message TransactionSnapshot {
  option (buf.validate.message).cel = {
    id: "transaction.distinct_parties"
    message: "farmer_id and reseller_id must differ"
    expression: "this.farmer_id != this.reseller_id"
  };

  // Transaction id (UUID). Equals the record key.
  string id = 1 [(buf.validate.field).string.uuid = true];

  // Listing the transaction was started from.
  string listing_id = 2 [(buf.validate.field).string.uuid = true];

  // Board of that listing. An offer is owned by the farmer, a buy-request by
  // the reseller; the other party started the transaction.
  common.v1.ListingKind listing_kind = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Seller (dehqon).
  string farmer_id = 4 [(buf.validate.field).string.uuid = true];

  // Buyer (olib sotuvchi).
  string reseller_id = 5 [(buf.validate.field).string.uuid = true];

  // Product, from the listing.
  common.v1.ProductType product = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Agreed quantity.
  common.v1.Mass quantity = 7 [(buf.validate.field).required = true];

  // Agreed price per kg or tonne.
  common.v1.UnitPrice unit_price = 8 [(buf.validate.field).required = true];

  // Where the goods change hands: the listing's address when the transaction
  // was created. Region and district feed the regional statistics.
  common.v1.Address address = 9 [(buf.validate.field).required = true];

  // Subtotal, tax, fee, total and payout.
  TransactionAmounts amounts = 10 [(buf.validate.field).required = true];

  // Current step.
  TransactionState state = 11 [
    (buf.validate.field).required = true,
    (buf.validate.field).enum.defined_only = true
  ];

  // Weighbridge receipt, once submitted.
  WeighbridgeReceipt receipt = 12;

  // Bonus points awarded on completion. TODO(bonus): rule not designed.
  int64 bonus_points = 13 [(buf.validate.field).int64.gte = 0];

  // Aggregate version; equals EventMetadata.aggregate_version.
  int64 version = 14 [(buf.validate.field).int64.gte = 1];

  // When the transaction was created.
  google.protobuf.Timestamp created_at = 15 [(buf.validate.field).required = true];

  // When the transaction last changed.
  google.protobuf.Timestamp updated_at = 16 [(buf.validate.field).required = true];

  // When escrow started holding the funds.
  google.protobuf.Timestamp payment_held_at = 17;

  // When the payout was released (state COMPLETED).
  google.protobuf.Timestamp completed_at = 18;
}

// TransactionCreated: the counterparty of a listing's owner started a
// transaction on it (a reseller on a farmer's offer, or a farmer on a
// reseller's buy-request). The agreed terms are in the snapshot; state
// AWAITING_PAYMENT.
message TransactionCreated {}

// PaymentHeld: the reseller's pay-in is confirmed and held in escrow; state
// PAYMENT_HELD. The farmer can now prepare the goods.
//
// TODO(payments): no payment provider yet. The stub holds the funds without
// moving money; provider details stay out of events even once integrated.
message PaymentHeld {
  // Amount held; equals amounts.total.
  common.v1.Money amount = 1 [(buf.validate.field).required = true];
}

// ReceiptSubmitted: the reseller collected and weighed the goods and submitted
// the weighbridge receipt; state RECEIPT_SUBMITTED.
message ReceiptSubmitted {
  // The receipt as submitted.
  WeighbridgeReceipt receipt = 1 [(buf.validate.field).required = true];
}

// ProductHandover: the farmer confirmed handing the goods over; state
// HANDED_OVER.
message ProductHandover {}

// ReceiptConfirmed: the reseller confirmed receiving the goods; state
// RECEIVED. order-escrow releases the payout next.
message ReceiptConfirmed {}

// PayoutReleased: escrow paid the farmer; state COMPLETED. The two parties
// may now rate each other.
//
// TODO(payments): the stub records the payout without moving money.
message PayoutReleased {
  // Amount paid out; equals amounts.payout_amount.
  common.v1.Money amount = 1 [(buf.validate.field).required = true];
}

// BonusAwarded: bonus points were credited to a party of a completed
// transaction.
//
// TODO(bonus): the rule is not designed. The app's mock credits the reseller
// 0.5% of the total.
message BonusAwarded {
  // Who receives the points (the reseller today).
  string recipient_id = 1 [(buf.validate.field).string.uuid = true];

  // Points credited. TODO(bonus): unit and redemption not designed.
  int64 points = 2 [(buf.validate.field).int64.gt = 0];
}
