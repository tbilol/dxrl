syntax = "proto3";

package agrogram.analytics.v1;

import "buf/validate/validate.proto";
import "common/v1/address.proto";
import "common/v1/auth.proto";
import "common/v1/market.proto";
import "common/v1/media.proto";
import "common/v1/money.proto";
import "common/v1/product.proto";
import "common/v1/quantity.proto";
import "common/v1/time.proto";
import "google/protobuf/timestamp.proto";

// AnalyticsService answers market-statistics queries. It builds its data from
// the listing and transaction streams (and the profile stream for names).
//
// The design is still being reworked, so the contract is built to grow: every
// query takes the same StatsFilter, every row carries all metrics (mass,
// value, count), and new periods, sources, metrics and queries are additive.
// Figures lag the streams by seconds to minutes; each response reports
// `data_as_of`. Available on every plan.
service AnalyticsService {
  // Ranks products, e.g. the top products by tonnage.
  rpc ListTopProducts(ListTopProductsRequest) returns (ListTopProductsResponse);

  // Ranks farmers or resellers, e.g. the top farmers by tonnage sold.
  rpc ListTopTraders(ListTopTradersRequest) returns (ListTopTradersResponse);

  // Returns average prices per product over time.
  rpc GetPriceTrend(GetPriceTrendRequest) returns (GetPriceTrendResponse);

  // Ranks regions by activity.
  rpc ListRegionStats(ListRegionStatsRequest) returns (ListRegionStatsResponse);

  // Returns what is planted: area and expected harvest per crop.
  // TODO(analytics-planted): the data source is not decided (e-ijara lease
  // data, yield-calculator inputs or farmer declarations). UNIMPLEMENTED until
  // then.
  rpc GetPlantedOverview(GetPlantedOverviewRequest) returns (GetPlantedOverviewResponse);
}

// StatsPeriod is a calendar period in Asia/Tashkent time, matching the app's
// period selector.
enum StatsPeriod {
  // THIS_MONTH, the app's default.
  STATS_PERIOD_UNSPECIFIED = 0;
  // Since midnight today.
  STATS_PERIOD_TODAY = 1;
  // Since Monday 00:00 of this week.
  STATS_PERIOD_THIS_WEEK = 2;
  // Since the 1st of this month.
  STATS_PERIOD_THIS_MONTH = 3;
  // Everything.
  STATS_PERIOD_ALL_TIME = 4;
}

// StatsSource is which facts the statistics count.
enum StatsSource {
  // DEALS.
  STATS_SOURCE_UNSPECIFIED = 0;
  // Completed escrow transactions: what was actually traded.
  STATS_SOURCE_DEALS = 1;
  // Listings posted: supply (offers) and demand (buy-requests).
  STATS_SOURCE_LISTINGS = 2;
}

// StatsMetric is what a ranking orders by.
enum StatsMetric {
  // MASS.
  STATS_METRIC_UNSPECIFIED = 0;
  // Total mass (tonnage).
  STATS_METRIC_MASS = 1;
  // Total value in UZS (price x mass).
  STATS_METRIC_VALUE = 2;
  // Number of deals or listings.
  STATS_METRIC_COUNT = 3;
}

// TimeBucket is the width of one point in a time series.
enum TimeBucket {
  // Picked from the period: hours for TODAY, days for a week or month,
  // months for ALL_TIME.
  TIME_BUCKET_UNSPECIFIED = 0;
  // One hour.
  TIME_BUCKET_HOUR = 1;
  // One day.
  TIME_BUCKET_DAY = 2;
  // One week, starting Monday.
  TIME_BUCKET_WEEK = 3;
  // One calendar month.
  TIME_BUCKET_MONTH = 4;
}

// StatsFilter selects the facts a query counts. Unset fields do not filter.
message StatsFilter {
  option (buf.validate.message).cel = {
    id: "stats_filter.district_needs_region"
    message: "district needs region"
    expression: "this.district == '' || this.region != 0"
  };

  // Calendar period. Ignored when `time_range` is set.
  StatsPeriod period = 1 [(buf.validate.field).enum.defined_only = true];

  // Explicit time range; overrides `period`.
  common.v1.TimeRange time_range = 2;

  // Deals or listings.
  StatsSource source = 3 [(buf.validate.field).enum.defined_only = true];

  // Board: offers (supply) or buy-requests (demand). For deals, the board the
  // deal started from. Unspecified = both.
  common.v1.ListingKind listing_kind = 4 [(buf.validate.field).enum.defined_only = true];

  // Region.
  common.v1.Region region = 5 [(buf.validate.field).enum.defined_only = true];

  // District within `region`.
  string district = 6 [(buf.validate.field).string.max_len = 120];

  // Products. Empty = all.
  repeated common.v1.ProductType product_types = 7 [(buf.validate.field).repeated = {
    max_items: 50
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
}

// ProductStats is one product's figures for the filter.
message ProductStats {
  // The product.
  common.v1.ProductType product = 1;

  // Total mass.
  common.v1.Mass total_mass = 2;

  // Total value (UZS).
  common.v1.Money total_value = 3;

  // Number of deals or listings.
  int64 count = 4;

  // Mass-weighted average price (per tonne). Unset if no priced facts.
  common.v1.UnitPrice average_price = 5;

  // Share of the ranking metric across all products, in basis points
  // (10000 = 100%).
  int32 share_basis_points = 6;
}

// TraderStats is one farmer's or reseller's figures for the filter.
message TraderStats {
  // User id.
  string user_id = 1;

  // Display name.
  string display_name = 2;

  // Profile picture.
  common.v1.MediaRef avatar = 3;

  // Region where the trader was most active.
  common.v1.Region region = 4;

  // District where the trader was most active.
  string district = 5;

  // Total mass.
  common.v1.Mass total_mass = 6;

  // Total value (UZS).
  common.v1.Money total_value = 7;

  // Number of deals or listings.
  int64 count = 8;

  // Product with the most mass.
  common.v1.ProductType top_product = 9;
}

// RegionStats is one region's figures for the filter.
message RegionStats {
  // The region.
  common.v1.Region region = 1;

  // Total mass.
  common.v1.Mass total_mass = 2;

  // Total value (UZS).
  common.v1.Money total_value = 3;

  // Number of deals or listings.
  int64 count = 4;

  // Distinct users behind those facts.
  int64 active_user_count = 5;
}

// PricePoint is one time bucket of a price series.
message PricePoint {
  // Start of the bucket.
  google.protobuf.Timestamp bucket_start = 1;

  // Mass-weighted average price (per tonne).
  common.v1.UnitPrice average_price = 2;

  // Lowest price in the bucket.
  common.v1.UnitPrice min_price = 3;

  // Highest price in the bucket.
  common.v1.UnitPrice max_price = 4;

  // Mass behind the prices.
  common.v1.Mass total_mass = 5;
}

// PriceSeries is the price history of one product. Buckets without priced
// facts are omitted.
message PriceSeries {
  // The product.
  common.v1.ProductType product = 1;

  // Points, oldest first.
  repeated PricePoint points = 2;
}

// PlantedCropStats is what is planted with one crop.
message PlantedCropStats {
  // The crop.
  common.v1.ProductType crop = 1;

  // Planted area.
  common.v1.Area area = 2;

  // Farmers growing it.
  int64 farmer_count = 3;

  // Expected harvest.
  common.v1.Mass estimated_yield = 4;

  // Share of the total planted area, in basis points (10000 = 100%).
  int32 share_basis_points = 5;
}

// ListTopProductsRequest is the input of ListTopProducts.
message ListTopProductsRequest {
  // Facts to count.
  StatsFilter filter = 1;

  // Ranking order (descending).
  StatsMetric rank_by = 2 [(buf.validate.field).enum.defined_only = true];

  // Rows to return. 0 = 10. Maximum 200.
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

// ListTopProductsResponse is the output of ListTopProducts.
message ListTopProductsResponse {
  // Products, best first.
  repeated ProductStats products = 1;

  // Facts up to this time are included.
  google.protobuf.Timestamp data_as_of = 2;
}

// ListTopTradersRequest is the input of ListTopTraders.
message ListTopTradersRequest {
  // Facts to count.
  StatsFilter filter = 1;

  // Which side to rank: ROLE_FARMER or ROLE_RESELLER.
  common.v1.Role role = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2
    ]
  }];

  // Ranking order (descending).
  StatsMetric rank_by = 3 [(buf.validate.field).enum.defined_only = true];

  // Rows to return. 0 = 10. Maximum 200.
  int32 limit = 4 [(buf.validate.field).int32 = {
    gte: 0
    lte: 200
  }];
}

// ListTopTradersResponse is the output of ListTopTraders.
message ListTopTradersResponse {
  // Traders, best first.
  repeated TraderStats traders = 1;

  // Facts up to this time are included.
  google.protobuf.Timestamp data_as_of = 2;
}

// GetPriceTrendRequest is the input of GetPriceTrend.
message GetPriceTrendRequest {
  // Facts to count. Use `product_types` to choose the series; empty = the
  // top 5 products by mass.
  StatsFilter filter = 1;

  // Width of one point.
  TimeBucket bucket = 2 [(buf.validate.field).enum.defined_only = true];
}

// GetPriceTrendResponse is the output of GetPriceTrend.
message GetPriceTrendResponse {
  // One series per product.
  repeated PriceSeries series = 1;

  // Facts up to this time are included.
  google.protobuf.Timestamp data_as_of = 2;
}

// ListRegionStatsRequest is the input of ListRegionStats.
message ListRegionStatsRequest {
  // Facts to count. `region` and `district` are ignored.
  StatsFilter filter = 1;

  // Ranking order (descending).
  StatsMetric rank_by = 2 [(buf.validate.field).enum.defined_only = true];
}

// ListRegionStatsResponse is the output of ListRegionStats.
message ListRegionStatsResponse {
  // Regions with any activity, best first.
  repeated RegionStats regions = 1;

  // Facts up to this time are included.
  google.protobuf.Timestamp data_as_of = 2;
}

// GetPlantedOverviewRequest is the input of GetPlantedOverview.
message GetPlantedOverviewRequest {
  // Region, district and products filter the overview; the period selects the
  // season. `source` and `listing_kind` are ignored.
  StatsFilter filter = 1;
}

// GetPlantedOverviewResponse is the output of GetPlantedOverview.
message GetPlantedOverviewResponse {
  // Total planted area.
  common.v1.Area total_area = 1;

  // Farmers with planted land.
  int64 farmer_count = 2;

  // Per crop, largest area first.
  repeated PlantedCropStats crops = 3;

  // Data up to this time is included.
  google.protobuf.Timestamp data_as_of = 4;
}
