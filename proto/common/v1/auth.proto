syntax = "proto3";

package agrogram.common.v1;

import "buf/validate/validate.proto";

// gRPC auth metadata convention
// =============================
//
// Clients never talk to services directly. The edge (api-gateway) validates
// the access token issued by auth-gateway, strips every client-supplied
// `x-agrogram-*` header, and forwards the verified identity as gRPC metadata:
//
//   x-agrogram-user-id     UUID of the signed-in user. Absent => anonymous call.
//   x-agrogram-roles       Comma-separated Role names without "ROLE_",
//                          e.g. "ADMIN". Absent when the user holds none.
//   x-agrogram-session-id  UUID of the sign-in session (refresh-token family).
//
// Always-present request context (set by the edge, propagated by everyone):
//
//   x-request-id           Correlation id (UUID). Generated by the edge when
//                          missing; copied into Kafka record headers.
//   traceparent            W3C Trace Context (OpenTelemetry); `tracestate` too.
//   accept-language        "uz" (default) or "ru".
//
// Service-to-service:
//
//   x-agrogram-caller      Name of the calling service, e.g. "profile-social".
//                          Set on every outgoing internal call.
//
// Rules: services read identity ONLY from these headers (never from request
// bodies); they forward the user headers unchanged on calls made on the user's
// behalf; roles are a token-time snapshot (access tokens are short-lived), so
// services that need the live value ask identity.
// Principal is the in-process form of these headers.

// Role is an authorization role. An account holds a set of roles, usually
// none: any signed-in user may post on either board (the board is the
// listing's kind, not a role), so roles are for staff only.
enum Role {
  // RESELLER (1) and FARMER (2) gated the two boards; the listings-only
  // platform has no seller check, so they are gone.
  reserved 1, 2;
  reserved "ROLE_RESELLER", "ROLE_FARMER";

  ROLE_UNSPECIFIED = 0;

  // Platform staff: moderation.
  ROLE_ADMIN = 3;
}

// Principal is the authenticated caller of a request, decoded from the
// `x-agrogram-*` metadata described above.
message Principal {
  // Account id (UUID). The same id is used by identity, profile-social and
  // every other service.
  string user_id = 1 [(buf.validate.field).string.uuid = true];

  // Premium plan flag: one flat tier now.
  reserved 3;
  reserved "is_premium";

  // Roles held when the access token was issued.
  repeated Role roles = 2 [(buf.validate.field).repeated.items.enum.defined_only = true];

  // Sign-in session id (UUID).
  string session_id = 4 [(buf.validate.field).string.uuid = true];
}

// Actor records who performed an action: a user, or a backend service acting
// on its own (e.g. catalog relaying its outbox). Used in events and audit
// trails.
message Actor {
  // Exactly one kind of actor.
  oneof kind {
    option (buf.validate.oneof).required = true;

    // A user acting through the app (UUID).
    string user_id = 1 [(buf.validate.field).string.uuid = true];

    // A backend service acting on its own, by service name, e.g. "catalog".
    string service = 2 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9-]{1,62}$"];
  }
}
